<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Despachos · Administrativo</title>
<meta name="theme-color" content="#0E3B47">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F2; --panel:#FFFFFF; --ink:#132B33; --muted:#5B7078; --line:#D3DCDF;
  --harbor:#0E3B47; --signal:#F2B705; --teal:#16697A; --teal-dark:#0F515F;
  --danger:#B3261E; --danger-bg:#FBEAE9;
  --pend-bg:#FBEFD3; --pend:#8A5A00;
  --proc-bg:#DCEAF8; --proc:#1D5FA8;
  --ok-bg:#DDF0E3; --ok:#23663F;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font:15px/1.45 'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg)}
h1,h2,h3{font-family:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:1px}
.muted{color:var(--muted)}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--harbor)}
.login-card{width:min(400px,100%);background:var(--panel);border-radius:10px;padding:28px 24px;border-top:6px solid var(--signal)}
.login-card img{height:44px;display:block;margin-bottom:18px}
.login-card h1{font-size:24px;margin-bottom:4px}
.login-card p{margin:0 0 20px}
.login-card label{display:block;font-weight:600;font-size:14px;margin-top:14px}
.login-card input{display:block;width:100%;margin-top:5px;padding:13px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:16px}
.err{color:var(--danger);font-size:14px;margin:12px 0 0;min-height:1em}
.ok{color:var(--ok);font-size:14px;margin:12px 0 0;min-height:1em}

/* Shell */
.app{display:flex;min-height:100vh}
aside{width:220px;flex:none;background:var(--harbor);color:#fff;display:flex;flex-direction:column}
aside .marca{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px}
aside .marca img{height:28px;flex:none;border-radius:4px}
aside .marca div{min-width:0}
aside .marca b{display:block;font-size:16px}
aside .marca span{font-size:11px;opacity:.7}
aside nav{flex:1;padding:14px 10px}
aside nav button{display:block;width:100%;text-align:left;padding:11px 12px;background:none;border:0;color:rgba(255,255,255,.75);border-radius:8px;font-weight:600;font-size:14px;margin-bottom:4px}
aside nav button.on{background:rgba(255,255,255,.12);color:#fff}
aside .quien{padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:13px}
aside .quien b{display:block;font-size:14px}
aside .quien button{margin-top:10px;background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:7px 10px;font-size:12px;width:100%}

main{flex:1;padding:26px 30px;min-width:0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.head h2{font-size:24px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{padding:10px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px;min-width:220px}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:700;font-size:14px}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:var(--teal-dark)}
.btn.danger{color:var(--danger);border-color:#E7B9B6}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:6px 10px;font-size:12.5px}

table{width:100%;border-collapse:collapse;background:var(--panel);border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
thead th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);background:#F5F8F8;padding:11px 14px;border-bottom:1px solid var(--line)}
tbody td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:#FAFCFC}
.tt{font-weight:700}
.pill{display:inline-block;padding:3px 10px;border-radius:3px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.pendiente{background:var(--pend-bg);color:var(--pend)}
.pill.en_proceso{background:var(--proc-bg);color:var(--proc)}
.pill.completado{background:var(--ok-bg);color:var(--ok)}
.pill.rol_super_admin{background:#F3E3D3;color:#8A4B00}
.pill.rol_administrativo{background:var(--proc-bg);color:var(--proc)}
.pill.rol_operativo{background:var(--ok-bg);color:var(--ok)}
.pill.inactivo{background:#EDEFF0;color:var(--muted)}
.pill.sinrol{background:#F3E3D3;color:#8A4B00}
.avance{display:flex;align-items:center;gap:8px;min-width:140px}
.barra{flex:1;height:7px;border-radius:4px;background:#E4EAEC;overflow:hidden}
.barra i{display:block;height:100%;background:var(--teal)}
.acciones{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:60px 16px;text-align:center;color:var(--muted);background:var(--panel);border-radius:10px;box-shadow:0 0 0 1px var(--line)}

.banner{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:8px;padding:14px 16px;margin-bottom:16px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.banner b{display:block;font-size:14px;margin-bottom:2px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(14,59,71,.5);display:grid;place-items:center;padding:20px;z-index:50}
.modal{width:min(520px,100%);background:var(--panel);border-radius:12px;padding:24px;max-height:90vh;overflow:auto}
.modal h3{font-size:19px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal label{display:block;font-weight:600;font-size:13px;margin-top:12px}
.modal input,.modal select{display:block;width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:14px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--harbor);color:#fff;padding:11px 20px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;font-weight:500}
#toast.show{opacity:1}
#toast.bad{background:var(--danger)}

@media (max-width:820px){
  .app{flex-direction:column}
  aside{width:100%;flex-direction:row;align-items:center;flex-wrap:wrap}
  aside .marca{border-bottom:0;border-right:1px solid rgba(255,255,255,.12)}
  aside nav{display:flex;padding:8px}
  aside nav button{width:auto;margin-right:4px}
  aside .quien{border-top:0;border-left:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px}
  aside .quien button{margin-top:0;width:auto}
  main{padding:18px}
  table{display:block;overflow-x:auto}
}
</style>
</head>
<body>

<section id="login" class="login">
  <form id="form-login" class="login-card" autocomplete="on">
    <img src="icons/icon-192.png" alt="">
    <h1>Despachos</h1>
    <p class="muted">Acceso para personal Administrativo.</p>
    <label>Correo
      <input type="email" name="email" required autocomplete="username" inputmode="email">
    </label>
    <label>Contraseña
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <p id="login-err" class="err" role="alert"></p>
    <button class="btn primary" type="submit" style="width:100%;margin-top:14px">Ingresar</button>
    <p class="muted" style="margin:16px 0 0;font-size:13px;text-align:center">
      <a href="registro.html" style="color:var(--teal);font-weight:600;text-decoration:none">Crear cuenta</a>
      <span style="margin:0 6px">·</span>
      <a href="index.html" style="color:var(--muted);text-decoration:none">App móvil Operativo</a>
    </p>
  </form>
</section>

<div id="app" class="app" hidden>
  <aside>
    <div class="marca">
      <img src="icons/icon-192.png" alt="">
      <div><b>Despachos</b><span>Panel Administrativo</span></div>
    </div>
    <nav id="nav">
      <button type="button" data-acc="tab" data-t="traslados" class="on">Traslados</button>
      <button type="button" data-acc="tab" data-t="despachos">Despachos</button>
      <button type="button" data-acc="tab" data-t="usuarios" id="nav-usuarios" hidden>Usuarios</button>
    </nav>
    <div class="quien">
      <b id="yo-nombre"></b><span id="yo-rol" class="muted"></span>
      <button type="button" data-acc="salir">Cerrar sesión</button>
    </div>
  </aside>
  <main id="main"><p class="muted">Cargando…</p></main>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ---------- Configuración ---------- */
// La clave "anon" es pública por diseño; la seguridad la dan las políticas RLS (setup_datos_app.sql).
const SUPABASE_URL = 'https://glzhwoswyditummgfbin.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdsemh3b3N3eWRpdHVtbWdmYmluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NDQyMzIsImV4cCI6MjEwNTMyMDIzMn0.ZY5bVbeahJ2mGXjWwN4IcofoyEvztHMIg1jR3tZ4Hug';

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('es-CO', {maximumFractionDigits: 2}).format(Number(n) || 0);
const fechaHora = d => new Date(d).toLocaleString('es-CO', {dateStyle: 'medium', timeStyle: 'short'});
const ESTADOS = {pendiente: 'Pendiente', en_proceso: 'En proceso', completado: 'Completado'};
const ROLES = {super_admin: 'Super Admin', administrativo: 'Administrativo', operativo: 'Operativo'};

let toastTmr;
function aviso(msg, malo) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (malo ? ' bad' : '');
  clearTimeout(toastTmr);
  toastTmr = setTimeout(() => t.className = '', 3200);
}

const state = {
  user: null, perfil: null,
  traslados: [], despachos: [], perfiles: [],
  tab: 'traslados', q: '', canal: null
};

let sb = null;

/* ---------- Arranque y sesión ---------- */
async function arrancar() {
  if (!window.supabase) {
    mostrarLogin('No se pudo cargar la librería de Supabase. Revisa tu conexión a internet.');
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(ev => {
    if (ev === 'SIGNED_OUT' && state.user) { limpiar(); mostrarLogin(); }
  });
  const { data: { session } } = await sb.auth.getSession();
  if (session) await entrar(session.user); else mostrarLogin();
}

function mostrarLogin(msg) {
  $('#app').hidden = true;
  $('#login').hidden = false;
  $('#login-err').textContent = msg || '';
}

function limpiar() {
  if (state.canal) { sb.removeChannel(state.canal); state.canal = null; }
  state.user = null; state.perfil = null;
  state.traslados = []; state.despachos = []; state.perfiles = [];
}

async function entrar(user) {
  const { data: perfil, error } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  let problema = '';
  if (error) problema = 'No se pudo leer tu perfil: ' + error.message;
  else if (!perfil) problema = 'Tu usuario aún no tiene un perfil. Contacta al Super Admin.';
  else if (!perfil.activo) problema = 'Tu usuario está desactivado. Habla con el Super Admin.';
  else if (!perfil.rol) problema = 'Tu cuenta está pendiente de que un Super Admin te asigne un rol.';
  else if (perfil.rol === 'operativo') problema = 'Este acceso es para personal Administrativo. El personal Operativo usa la app móvil de Despachos.';
  if (problema) {
    await sb.auth.signOut();
    mostrarLogin(problema);
    return;
  }
  state.user = user;
  state.perfil = perfil;
  $('#login').hidden = true;
  $('#app').hidden = false;
  $('#yo-nombre').textContent = perfil.nombre;
  $('#yo-rol').textContent = ROLES[perfil.rol];
  $('#nav-usuarios').hidden = perfil.rol !== 'super_admin';
  if (perfil.rol !== 'super_admin' && state.tab === 'usuarios') state.tab = 'traslados';
  await cargarDatos();
  render();
  suscribir();
}

/* ---------- Datos ---------- */
async function cargarDatos() {
  const llamadas = [
    sb.from('traslados').select('*').order('created_at', { ascending: false }),
    sb.from('despachos').select('*, traslados(tt,bl), profiles(nombre)').order('created_at', { ascending: false }).limit(300)
  ];
  if (state.perfil.rol === 'super_admin') {
    llamadas.push(sb.from('profiles').select('*').order('created_at', { ascending: false }));
  }
  const [t, d, p] = await Promise.all(llamadas);
  if (t.error) { aviso('Error al cargar traslados: ' + t.error.message, true); return; }
  state.traslados = t.data;
  state.despachos = d.error ? [] : d.data;
  if (p) state.perfiles = p.error ? [] : p.data;
}

function suscribir() {
  if (state.canal) sb.removeChannel(state.canal);
  state.canal = sb.channel('cambios-admin')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'traslados' }, refrescar)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'despachos' }, refrescar)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, refrescar)
    .subscribe();
}

let refTmr;
function refrescar() {
  clearTimeout(refTmr);
  refTmr = setTimeout(async () => {
    if (!state.user) return;
    await cargarDatos();
    render();
  }, 250);
}

/* ---------- Render raíz ---------- */
function render() {
  document.querySelectorAll('#nav button[data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === state.tab));
  const main = $('#main');
  const teniaFoco = document.activeElement && document.activeElement.id === 'q';
  const cursor = teniaFoco ? document.activeElement.selectionStart : null;
  if (state.tab === 'traslados') main.innerHTML = vistaTraslados();
  else if (state.tab === 'despachos') main.innerHTML = vistaDespachos();
  else main.innerHTML = vistaUsuarios();
  if (teniaFoco && $('#q')) { const el = $('#q'); el.focus(); el.setSelectionRange(cursor, cursor); }
}

/* ---------- Traslados ---------- */
function vistaTraslados() {
  const q = state.q.trim().toLowerCase();
  const lista = state.traslados.filter(t => !q || [t.tt, t.bl, t.producto].some(v => String(v || '').toLowerCase().includes(q)));
  const filas = lista.map(t => {
    const total = Number(t.cantidad_total) || 0;
    const hecho = Number(t.cantidad_despachada) || 0;
    const pct = total > 0 ? Math.min(100, (hecho / total) * 100) : 0;
    return '<tr>' +
      '<td><div class="tt">TT ' + esc(t.tt) + '</div><div class="muted">BL ' + esc(t.bl) + '</div></td>' +
      '<td>' + esc(t.producto || '—') + '</td>' +
      '<td>' + esc(t.origen || '—') + (t.destino ? ' → ' + esc(t.destino) : '') + '</td>' +
      '<td><div class="avance"><div class="barra"><i style="width:' + pct + '%"></i></div><span class="muted">' + fmt(hecho) + ' / ' + fmt(total) + '</span></div></td>' +
      '<td><span class="pill ' + t.estado + '">' + ESTADOS[t.estado] + '</span></td>' +
      '<td><div class="acciones">' +
        '<button class="btn sm" type="button" data-acc="editar" data-id="' + t.id + '">Editar</button>' +
        '<button class="btn sm danger" type="button" data-acc="eliminar" data-id="' + t.id + '">Eliminar</button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
  return '<div class="head"><h2>Traslados</h2>' +
    '<div class="toolbar"><input id="q" class="search" type="search" placeholder="Buscar por TT, BL o producto" value="' + esc(state.q) + '">' +
    '<button class="btn primary" type="button" data-acc="nuevo">+ Nuevo traslado</button></div></div>' +
    (lista.length ? '<table><thead><tr><th>TT / BL</th><th>Producto</th><th>Ruta</th><th>Avance</th><th>Estado</th><th></th></tr></thead><tbody>' + filas + '</tbody></table>'
      : '<div class="empty">' + (state.traslados.length ? 'Ningún traslado coincide con la búsqueda.' : 'Todavía no hay traslados. Crea el primero.') + '</div>');
}

function abrirModalTraslado(id) {
  const t = id ? state.traslados.find(x => x.id === id) : null;
  const html = '<div class="modal-bg" id="modal-bg"><form class="modal" id="form-traslado">' +
    '<h3>' + (t ? 'Editar traslado' : 'Nuevo traslado') + '</h3>' +
    '<div class="grid2">' +
      '<label>TT<input name="tt" required value="' + (t ? esc(t.tt) : '') + '"></label>' +
      '<label>BL<input name="bl" required value="' + (t ? esc(t.bl) : '') + '"></label>' +
    '</div>' +
    '<label>Producto / carga<input name="producto" value="' + (t ? esc(t.producto || '') : '') + '"></label>' +
    '<div class="grid2">' +
      '<label>Origen<input name="origen" value="' + (t ? esc(t.origen || '') : '') + '"></label>' +
      '<label>Destino<input name="destino" value="' + (t ? esc(t.destino || '') : '') + '"></label>' +
    '</div>' +
    '<label>Cantidad total<input name="cantidad_total" type="number" min="0.01" step="any" required value="' + (t ? t.cantidad_total : '') + '"></label>' +
    (t ? '<p class="muted" style="margin-top:8px;font-size:13px">Ya despachado: ' + fmt(t.cantidad_despachada) + '. La cantidad total no puede quedar por debajo de eso.</p>' : '') +
    '<p class="err" id="tr-err" role="alert"></p>' +
    '<div class="modal-f"><button class="btn" type="button" data-acc="cerrar-modal">Cancelar</button>' +
    '<button class="btn primary" type="submit">' + (t ? 'Guardar cambios' : 'Crear traslado') + '</button></div>' +
  '</form></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  $('#form-traslado').addEventListener('submit', async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const err = $('#tr-err');
    err.textContent = '';
    const cantidad_total = Number(fd.get('cantidad_total'));
    if (t && cantidad_total < Number(t.cantidad_despachada)) {
      err.textContent = 'No puede ser menor que lo ya despachado (' + fmt(t.cantidad_despachada) + ').';
      return;
    }
    const payload = {
      tt: String(fd.get('tt')).trim(),
      bl: String(fd.get('bl')).trim(),
      producto: String(fd.get('producto')).trim() || null,
      origen: String(fd.get('origen')).trim() || null,
      destino: String(fd.get('destino')).trim() || null,
      cantidad_total
    };
    const btn = ev.target.querySelector('button[type=submit]');
    btn.disabled = true;
    const { error } = t
      ? await sb.from('traslados').update(payload).eq('id', t.id)
      : await sb.from('traslados').insert({ ...payload, created_by: state.user.id });
    btn.disabled = false;
    if (error) { err.textContent = 'No se pudo guardar: ' + error.message; return; }
    cerrarModal();
    aviso(t ? 'Traslado actualizado' : 'Traslado creado');
    await cargarDatos();
    render();
  });
}

async function eliminarTraslado(id) {
  const t = state.traslados.find(x => x.id === id);
  if (!t) return;
  if (!confirm('¿Eliminar el traslado ' + t.tt + ' (BL ' + t.bl + ')? También se borrará su historial de despachos.')) return;
  const { error } = await sb.from('traslados').delete().eq('id', id);
  if (error) { aviso('No se pudo eliminar: ' + error.message, true); return; }
  aviso('Traslado eliminado');
  await cargarDatos();
  render();
}

/* ---------- Despachos (historial) ---------- */
function vistaDespachos() {
  const q = state.q.trim().toLowerCase();
  const lista = state.despachos.filter(d => {
    const tt = d.traslados ? d.traslados.tt : '';
    const bl = d.traslados ? d.traslados.bl : '';
    const quien = d.profiles ? d.profiles.nombre : '';
    return !q || [tt, bl, quien].some(v => String(v || '').toLowerCase().includes(q));
  });
  const filas = lista.map(d => '<tr>' +
    '<td><div class="tt">' + esc(d.traslados ? 'TT ' + d.traslados.tt : 'Traslado eliminado') + '</div>' +
    '<div class="muted">BL ' + esc(d.traslados ? d.traslados.bl : '—') + '</div></td>' +
    '<td>' + esc(d.profiles ? d.profiles.nombre : '—') + '</td>' +
    '<td>' + fmt(d.cantidad) + '</td>' +
    '<td class="muted">' + fechaHora(d.created_at) + '</td>' +
  '</tr>').join('');
  return '<div class="head"><h2>Despachos</h2>' +
    '<div class="toolbar"><input id="q" class="search" type="search" placeholder="Buscar por TT, BL u operador" value="' + esc(state.q) + '"></div></div>' +
    (lista.length ? '<table><thead><tr><th>TT / BL</th><th>Operador</th><th>Cantidad</th><th>Fecha</th></tr></thead><tbody>' + filas + '</tbody></table>'
      : '<div class="empty">' + (state.despachos.length ? 'Ningún despacho coincide con la búsqueda.' : 'Todavía no se han registrado despachos.') + '</div>');
}

/* ---------- Usuarios (solo Super Admin) ---------- */
function vistaUsuarios() {
  const q = state.q.trim().toLowerCase();
  const lista = state.perfiles.filter(p => !q || String(p.nombre || '').toLowerCase().includes(q));
  const enlaceRegistro = new URL('registro.html', location.href).href;
  const filas = lista.map(p => '<tr>' +
    '<td class="tt">' + esc(p.nombre || '(sin nombre)') + (p.id === state.user.id ? ' <span class="muted">(tú)</span>' : '') + '</td>' +
    '<td>' + (p.rol ? '<span class="pill rol_' + p.rol + '">' + ROLES[p.rol] + '</span>' : '<span class="pill sinrol">Sin asignar</span>') + '</td>' +
    '<td>' + (p.activo ? '<span class="pill completado">Activo</span>' : '<span class="pill inactivo">Inactivo</span>') + '</td>' +
    '<td><div class="acciones"><button class="btn sm" type="button" data-acc="editar-usuario" data-id="' + p.id + '">Editar</button></div></td>' +
  '</tr>').join('');
  return '<div class="head"><h2>Usuarios</h2>' +
    '<div class="toolbar"><input id="q" class="search" type="search" placeholder="Buscar por nombre" value="' + esc(state.q) + '"></div></div>' +
    '<div class="banner"><div><b>Para dar acceso a alguien nuevo</b>' +
      'Comparte el enlace de registro. La persona crea su cuenta, y aquí le asignas rol y la activas.</div>' +
      '<button class="btn sm" type="button" data-acc="copiar-registro" data-url="' + esc(enlaceRegistro) + '">Copiar enlace de registro</button></div>' +
    (lista.length ? '<table><thead><tr><th>Nombre</th><th>Rol</th><th>Estado</th><th></th></tr></thead><tbody>' + filas + '</tbody></table>'
      : '<div class="empty">No hay usuarios que coincidan.</div>');
}

function abrirModalEditarUsuario(id) {
  const p = state.perfiles.find(x => x.id === id);
  if (!p) return;
  const html = '<div class="modal-bg" id="modal-bg"><form class="modal" id="form-editar-usuario">' +
    '<h3>Editar usuario</h3>' +
    '<label>Nombre<input name="nombre" required value="' + esc(p.nombre || '') + '"></label>' +
    '<label>Rol<select name="rol">' +
      '<option value="">Sin asignar</option>' +
      '<option value="operativo"' + (p.rol === 'operativo' ? ' selected' : '') + '>Operativo</option>' +
      '<option value="administrativo"' + (p.rol === 'administrativo' ? ' selected' : '') + '>Administrativo</option>' +
      '<option value="super_admin"' + (p.rol === 'super_admin' ? ' selected' : '') + '>Super Admin</option>' +
    '</select></label>' +
    '<label><input type="checkbox" name="activo" ' + (p.activo ? 'checked' : '') + ' style="width:auto;display:inline-block;margin-right:8px"> Cuenta activa</label>' +
    '<p class="err" id="eu-err" role="alert"></p>' +
    '<div class="modal-f"><button class="btn" type="button" data-acc="cerrar-modal">Cancelar</button>' +
    '<button class="btn primary" type="submit">Guardar</button></div>' +
  '</form></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  $('#form-editar-usuario').addEventListener('submit', async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const err = $('#eu-err');
    err.textContent = '';
    const payload = {
      nombre: String(fd.get('nombre')).trim(),
      rol: String(fd.get('rol')) || null,
      activo: fd.get('activo') === 'on'
    };
    if (p.id === state.user.id && (payload.rol !== 'super_admin' || !payload.activo)) {
      err.textContent = 'No puedes quitarte a ti mismo el rol de Super Admin ni desactivarte.';
      return;
    }
    const btn = ev.target.querySelector('button[type=submit]');
    btn.disabled = true;
    const { error } = await sb.from('profiles').update(payload).eq('id', p.id);
    btn.disabled = false;
    if (error) { err.textContent = 'No se pudo guardar: ' + error.message; return; }
    cerrarModal();
    aviso('Usuario actualizado');
    await cargarDatos();
    render();
  });
}

function cerrarModal() {
  const bg = $('#modal-bg');
  if (bg) bg.remove();
}

/* ---------- Eventos ---------- */
$('#form-login').addEventListener('submit', async ev => {
  ev.preventDefault();
  const fd = new FormData(ev.target);
  $('#login-err').textContent = '';
  const btn = ev.target.querySelector('button[type=submit]');
  btn.disabled = true;
  const { data, error } = await sb.auth.signInWithPassword({ email: String(fd.get('email')).trim(), password: String(fd.get('password')) });
  btn.disabled = false;
  if (error) { $('#login-err').textContent = 'Correo o contraseña incorrectos.'; return; }
  ev.target.reset();
  await entrar(data.user);
});

document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-acc]');
  if (!b) return;
  const id = b.dataset.id;
  switch (b.dataset.acc) {
    case 'tab': state.tab = b.dataset.t; state.q = ''; render(); break;
    case 'nuevo': abrirModalTraslado(null); break;
    case 'editar': abrirModalTraslado(id); break;
    case 'eliminar': eliminarTraslado(id); break;
    case 'editar-usuario': abrirModalEditarUsuario(id); break;
    case 'cerrar-modal': cerrarModal(); break;
    case 'copiar-registro': {
      const url = b.dataset.url;
      try {
        await navigator.clipboard.writeText(url);
        aviso('Enlace copiado');
      } catch (e) {
        aviso(url, false);
      }
      break;
    }
    case 'salir': await sb.auth.signOut(); break;
  }
  if (ev.target.id === 'modal-bg') cerrarModal();
});

document.addEventListener('input', ev => {
  if (ev.target.id === 'q') { state.q = ev.target.value; render(); }
});

arrancar();
</script>
</body>
</html>
